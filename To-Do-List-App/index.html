<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — My To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <div class="app">

    <header class="app-header">
      <div class="header-top">
        <div>
          <h1>TaskFlow</h1>
          <p class="tagline">Plan. Focus. Get things done.</p>
        </div>
        <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
      </div>
    </header>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search tasks...">
    </div>

    <div class="input-card">
      <input type="text" id="taskInput" placeholder="What needs to be done?">
      <div class="input-row-secondary">
        <select id="priorityInput">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="categoryInput">
          <option value="study">📚 Study</option>
          <option value="coding">💻 Coding</option>
          <option value="personal">📝 Personal</option>
          <option value="other">🏷️ Other</option>
        </select>
        <input type="date" id="dueDateInput">
        <button id="addBtn">Add</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <div class="stats-row">
      <div class="stat">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="doneCount">0</span>
        <span class="stat-label">Done</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="pendingCount">0</span>
        <span class="stat-label">Left</span>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span>Today's Progress</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <ul id="taskList"></ul>

    <p id="emptyState" class="empty-state">No tasks yet. Add one above to get started ✨</p>

    <footer class="app-footer">
      <span id="taskCountFooter">0 tasks</span>
      <button id="clearCompletedBtn">Clear Completed</button>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
